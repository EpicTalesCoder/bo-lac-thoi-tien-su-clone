name: Web Portal CI

on:
  push:
    branches: [main]
    paths:
      - "games/**"
      - "portal/**"
      - "tools/**"
      - "vercel.json"
      - "netlify.toml"
      - ".github/workflows/deploy-web-port.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "web-portal"
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify web-port assets and build Multi-Game Portal into dist/
        run: |
          python3 -c '
          import pathlib
          root = pathlib.Path("games/bo-lac-thoi-tien-su/web-port")
          for name in ["game.js", "render-original.js", "scenario-loader.js", "campaign-story.js", "storage-i18n.js", "audio-binary.js"]:
              p = root / name
              assert p.exists(), f"Missing {p}"
              txt = p.read_text()
              assert txt.count("{") == txt.count("}"), f"Brace mismatch in {name}"
          for asset in ["assets/a", "assets/ma", "assets/pd0", "assets/sa", "assets/0/d0"]:
              ap = root / asset
              assert ap.exists(), f"Missing required binary asset {ap}"
          print("All web-port JS modules and binary assets verified!")
          '
          python3 tools/build-portal.py
